function spawnTree(){let x=R(35,W-35),y=R(45,H-35);for(let i=0;i<24;i++){x=R(35,W-35);y=R(45,H-35);if(Math.hypot(x-G.p.x,y-G.p.y)>60&&G.trees.every(t=>Math.hypot(x-t.x,y-t.y)>36))break}G.trees.push({x,y,hits:0,dead:false})}

for(let i=0;i<G.st.pocketFactory;i++)G.tu.push({x:tree.x,y:tree.y,cd:0,a:0,fl:0});achievementProgress.factoryTurrets+=G.st.pocketFactory;checkAchievements();saveAchievementProgress();
const crateChance=Math.min(1,.2*(1+Math.max(0,G.st.luck)*.05));if(Math.random()<crateChance)G.crates.push({x:tree.x,y:tree.y});else G.fruits.push({x:tree.x,y:tree.y})}
function collectCrate(crate){achievementProgress.treeCratesCollected++;checkAchievements();saveAchievementProgress();if(G.st.bag>0)earnGold(G.st.bag);if(Math.random()<.5){const amount=10+G.wave;earnGold(amount);showLootMessage('📦 +'+amount+' monedas')}else{const tier=rollTier(G.wave),pool=IT.filter(item=>item.t<=tier),item=pick(pool);add(item.s);showLootMessage('📦 '+item.n)}}

function burst(x,y,c,n,sp){if(G.pa.length>450)return;for(let i=0;i<n;i++){const a=R(0,6.28),v=R(.3,1)*sp;G.pa.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.3,.6),m:.6,c,s:R(1.5,4)})}}
function addTempDamage(lost){if(G.ch==='Masoquista'&&lost>0){G.tempDmg=Math.min(1,G.tempDmg+lost*.05);G.tempDmgTimer=5;achievementProgress.masochistHpLost+=lost;checkAchievements();saveAchievementProgress()}}
function dmgP(d){if(G.p.inv>0)return;if(Math.random()<Math.min(.6,G.st.dg)){if(G.st.adrenaline>0&&Math.random()<Math.min(.8,G.st.adrenaline*.25))G.hp=Math.min(G.maxhp,G.hp+1);return}const lost=Math.min(G.hp,Math.max(1,d*(1-G.st.arm/(G.st.arm+15))));G.hp-=lost;addTempDamage(lost);G.damageTakenWave++;G.p.inv=.4;G.shake=.25;G.flash=.35;burst(G.p.x,G.p.y,'#ff5050',8,160);if(G.hp<=0)over(false)}
/* daño a un enemigo: robo de vida y quemadura */
function knockback(e,dx,dy,power){const len=Math.hypot(dx,dy)||1,force=Math.max(0,power);e.x+=dx/len*force;e.y+=dy/len*force}
function hit(e,dm,src,cr){const sourceId=src&&src.id?src.id:src&&typeof src.k==='string'?src.k:null;if(sourceId)e.lastHit=sourceId;else if(src&&Object.prototype.hasOwnProperty.call(src,'fire'))e.lastHit=null;e.hp-=dm;e.fl=.1;burst(e.x,e.y,cr?'#ffd24a':'#fff',cr?6:2,cr?180:110);
const steal=Math.min(1,(G.st.ls||0)+(src&&src.lifeSteal||0));if(steal>0&&Math.random()<steal&&G.hp<G.maxhp){G.hp=Math.min(G.maxhp,G.hp+1);burst(G.p.x,G.p.y,'#6fe08a',4,90)}
if(src&&src.lightning){let target=null,range=115;for(const other of G.en){const dist=Math.hypot(other.x-e.x,other.y-e.y);if(other!==e&&other.hp>0&&dist<range){range=dist;target=other}}if(target){const zap=(4+(G.st.ele||0)*2)*src.lightning*dmgBase()*(G.ch==='Mago'?1.25:1);target.hp-=zap;target.fl=.1;target.lastHit=sourceId;burst(target.x,target.y,'#5de0ff',8,190)}}
const bd=((G.st.ele||0)+(src&&src.fire?4:0))*(G.ch==='Mago'?1.25:1),sausage=G.st.sausage>0&&Math.random()<G.st.sausage;if(bd>0||sausage){e.bn=3;e.bd=Math.max(e.bd||0,bd||1)}}
function explode(x,y,r,dm,fire){G.fx.push({x,y,a:0,r,t:.25,m:.25,ex:1});burst(x,y,'#ffb347',16,260);G.shake=Math.max(G.shake,.12);for(const e of G.en)if(Math.hypot(e.x-x,e.y-y)<r+e.r)hit(e,dm,{fire},false);for(const tree of G.trees)if(!tree.dead&&Math.hypot(tree.x-x,tree.y-y)<r+15)damageTree(tree)}
function boom(q){explode(q.x,q.y,q.aoe,q.dm,false)}
function bounceProjectile(q,e){let target=null,range=180;for(const other of G.en){const dist=Math.hypot(other.x-e.x,other.y-e.y);if(other!==e&&other.hp>0&&!q.hit.has(other)&&dist<range){range=dist;target=other}}if(!target)return false;const speed=Math.hypot(q.vx,q.vy)||1,dx=target.x-e.x,dy=target.y-e.y,len=Math.hypot(dx,dy)||1;q.vx=dx/len*speed;q.vy=dy/len*speed;q.x=e.x+dx/len*(e.r+2);q.y=e.y+dy/len*(e.r+2);q.life=Math.max(q.life,.5);q.hit.add(e);q.bounces--;return true}
function lvChk(){let required=xpForNextLevel(G.lv);while(G.xp>=required){G.xp-=required;G.lv++;G.pend++;required=xpForNextLevel(G.lv)}}

function update(dt){if(!G||G.sc!='wave')return;if(G.tempDmgTimer>0){G.tempDmgTimer-=dt;if(G.tempDmgTimer<=0){G.tempDmgTimer=0;G.tempDmg=0}}if(G.lootMessageTimer>0)G.lootMessageTimer=Math.max(0,G.lootMessageTimer-dt);G.treeTimer-=dt;while(G.treeTimer<=0){G.treeTimer+=10;const count=1+(G.st.tree||0)+(G.ch==='Explorador'?1:0);for(let i=0;i<count;i++)spawnTree()}const p=G.p;
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
if(ptr){const ax=ptr.x-p.x,ay=ptr.y-p.y,l=Math.hypot(ax,ay);if(l>12){dx=ax/l;dy=ay/l}}
const l=Math.hypot(dx,dy)||1,v=Math.max(60,200*(1+G.st.spd));p.x=Math.max(14,Math.min(W-14,p.x+dx/l*v*dt*(dx||dy?1:0)));p.y=Math.max(14,Math.min(H-14,p.y+dy/l*v*dt*(dx||dy?1:0)));
if(dx)p.face=dx>0?1:-1;
p.inv-=dt;G.hp=Math.min(G.maxhp,G.hp+G.st.rg*.4*dt);G.t-=dt;G.shake=Math.max(0,G.shake-dt);G.flash=Math.max(0,G.flash-dt);
G.sp-=dt;if(G.sp<=0&&G.en.length<90&&G.t>1){G.sp=Math.max(.22,1.1-G.wave*.04);const n=1+Math.floor(G.wave/5);for(let i=0;i<n;i++){const w=G.wave,r=Math.random();spawn(w>=3&&r<.2?'fast':w>=5&&r<.35?'tank':w>=4&&r<.5?'shoot':'bas')}}
/* armas */
if(G.st.alienEyes>0){G.alienEyeCd-=dt;if(G.alienEyeCd<=0){G.alienEyeCd=3.5;const count=Math.min(4,G.st.alienEyes),dm=(2+G.maxhp*.15)*count*dmgBase();for(let i=0;i<8;i++){const a=i/8*Math.PI*2;G.pr.push({k:'alien',x:p.x,y:p.y,vx:Math.cos(a)*360,vy:Math.sin(a)*360,dm,life:1.5,l0:1.5,hit:new Set(),pierce:G.st.bandana,bounces:G.st.ricochet||0,tr:[]})}}}
G.wp.forEach(w=>{const d=WP[w.id];if(d.selfDrain){w.drain=(w.drain||0)+dt;if(w.drain>=1){const loss=Math.floor(w.drain),before=G.hp;w.drain-=loss;G.hp=Math.max(0,G.hp-loss);addTempDamage(before-G.hp);if(G.hp<=0)over(false)}}w.cd-=dt;if(w.rc>0)w.rc-=dt;if(w.cd>0)return;const rr=wr(d);let b=null,bd=rr;for(const e of G.en){const q=Math.hypot(e.x-p.x,e.y-p.y)-e.r;if(q<bd){bd=q;b=e}}for(const tree of G.trees)if(!tree.dead){const q=Math.hypot(tree.x-p.x,tree.y-p.y)-15;if(q<bd){bd=q;b=tree}}if(!b)return;
w.cd=d.cd/(1+G.st.as);const a=Math.atan2(b.y-p.y,b.x-p.x);w.a=a;w.rc=.12;
const m=weaponMultiplier(w),cr=Math.random()<G.st.cr+(d.t=='m'?.05:0),dm=d.d*m*(cr?2+G.st.cd:1);
if(d.t=='m'){G.fx.push({x:p.x,y:p.y,a,r:rr,t:.15,m:.15,k:w.id});for(const e of G.en){const q=Math.atan2(e.y-p.y,e.x-p.x);let df=Math.abs(q-a);if(df>Math.PI)df=2*Math.PI-df;if(Math.hypot(e.x-p.x,e.y-p.y)<rr+e.r&&df<d.arc){hit(e,dm,{...d,id:w.id},cr);knockback(e,Math.cos(q),Math.sin(q),d.kb+G.st.kb)}}for(const tree of G.trees)if(!tree.dead){const q=Math.atan2(tree.y-p.y,tree.x-p.x);let df=Math.abs(q-a);if(df>Math.PI)df=2*Math.PI-df;if(Math.hypot(tree.x-p.x,tree.y-p.y)<rr+15&&df<d.arc)damageTree(tree)}}
else{const k=d.k||1;for(let j=0;j<k;j++){const aa=a+(d.sg?R(-d.sg,d.sg):0),lf=rr/d.sp;G.pr.push({k:w.id,x:p.x,y:p.y,vx:Math.cos(aa)*d.sp,vy:Math.sin(aa)*d.sp,dm,life:lf,l0:lf,aoe:d.aoe,pierce:(d.pierce||0)+G.st.bandana,hit:new Set(),bounces:G.st.ricochet||0,kb:d.kb||0,fire:d.fire,lifeSteal:d.lifeSteal,lightning:d.lightning,tr:[],cr})}}});
/* torretas y minas */
for(const t of G.tu){t.cd-=dt;t.fl-=dt;let b=null,bd=240;for(const e of G.en){const q=Math.hypot(e.x-t.x,e.y-t.y);if(q<bd){bd=q;b=e}}for(const tree of G.trees)if(!tree.dead){const q=Math.hypot(tree.x-t.x,tree.y-t.y);if(q<bd){bd=q;b=tree}}if(!b)continue;t.a=Math.atan2(b.y-t.y,b.x-t.x);
if(t.cd<=0){t.cd=.8/(1+G.st.as*.5);t.fl=.1;G.pr.push({k:'tur',x:t.x,y:t.y,vx:Math.cos(t.a)*520,vy:Math.sin(t.a)*520,dm:7*em()*dmgBase(),life:.46,l0:.46,tr:[],hit:new Set(),pierce:G.st.bandana,bounces:G.st.ricochet||0})}}
for(const m of G.mi){m.a-=dt;if(m.a>0)continue;for(const e of G.en)if(Math.hypot(e.x-m.x,e.y-m.y)<e.r+14){explode(m.x,m.y,62,22*em()*dmgBase(),false);m.d=1;break}}G.mi=G.mi.filter(m=>!m.d);
/* proyectiles */
for(const q of G.pr){q.tr.push({x:q.x,y:q.y});if(q.tr.length>6)q.tr.shift();q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.aoe&&q.life<=0)boom(q);let bounced=false;
for(const e of G.en){if(q.life<=0)break;if(Math.hypot(e.x-q.x,e.y-q.y)<e.r+(q.pierce?10:4)){if(q.aoe){if(q.bounces>0&&bounceProjectile(q,e)){bounced=true;break}q.life=0;boom(q);break}if(q.hit.has(e))continue;hit(e,q.dm,q,q.cr);q.hit.add(e);if(q.kb)knockback(e,q.vx,q.vy,q.kb+G.st.kb);if(q.bounces>0&&bounceProjectile(q,e)){bounced=true;break}if(q.pierce>0)q.pierce--;else q.life=0}}
if(q.life>0&&!bounced)for(const tree of G.trees){if(tree.dead||q.life<=0)continue;if(Math.hypot(tree.x-q.x,tree.y-q.y)<15+(q.pierce?10:4)){if(q.aoe){if(q.bounces>0&&bounceProjectile(q,tree))break;q.life=0;boom(q);break}if(q.hit.has(tree))continue;damageTree(tree);q.hit.add(tree);if(q.bounces>0&&bounceProjectile(q,tree))break;q.life=0;break}}}
G.pr=G.pr.filter(q=>q.life>0);G.trees=G.trees.filter(tree=>!tree.dead);
for(const e of G.en){const a=Math.atan2(p.y-e.y,p.x-e.x),d=Math.hypot(p.x-e.x,p.y-e.y);e.fl-=dt;
if(e.bn>0){e.bn-=dt;e.hp-=e.bd*dt;if(Math.random()<dt*14&&G.pa.length<450)G.pa.push({x:e.x+R(-e.r/2,e.r/2),y:e.y-e.r*.3,vx:R(-15,15),vy:-R(20,50),l:.35,m:.35,c:Math.random()<.5?'#ff9a2a':'#ffd24a',s:R(1.5,3)})}
if(!(e.sh&&d<230)){e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt}
if(e.sh){e.cd-=dt;if(e.cd<=0){e.cd=e.ty=='boss'?.9:2.2;const n=e.ty=='boss'?5:1;for(let j=0;j<n;j++){const aa=a+(n>1?(j-2)*.25:0);G.eb.push({x:e.x,y:e.y,vx:Math.cos(aa)*180,vy:Math.sin(aa)*180,dm:e.dm,life:4})}}}
if(d<e.r+12)dmgP(e.dm)}
for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<14){b.life=0;dmgP(b.dm)}}G.eb=G.eb.filter(b=>b.life>0);
const lk=Math.min(.5,G.st.luck*.02);let killsRecorded=0,mageBurnKillsRecorded=0;
G.en=G.en.filter(e=>{if(e.hp>0)return true;achievementProgress.totalKills++;G.kills++;killsRecorded++;if(e.bn>0&&G.ch==='Mago'){achievementProgress.mageBurnKills++;mageBurnKillsRecorded++}if(e.lastHit==='scythe')G.scytheKills++;if(e.ty=='boss'){achievementProgress.bossKills++;G.bossesKilled++}if(e.bn>0&&G.st.snake>0)for(const other of G.en)if(other!==e&&other.hp>0&&Math.hypot(other.x-e.x,other.y-e.y)<90){other.bn=3;other.bd=Math.max(other.bd||0,e.bd||1)}const n=e.g;burst(e.x,e.y,e.c,Math.min(22,6+e.r/2),e.ty=='boss'?320:180);if(e.ty=='boss')G.shake=.5;for(let i=0;i<Math.min(n,6);i++){let v=n>6?5:Math.ceil(n/Math.min(n,6));if(Math.random()<lk)v*=2;G.co.push({x:e.x+R(-8,8),y:e.y+R(-8,8),v,at:0})}return false});
if(killsRecorded){checkAchievements();if(mageBurnKillsRecorded||achievementProgress.totalKills%10<killsRecorded)saveAchievementProgress()}
const end=G.t<=0,pk=70+G.st.rng*.6;for(const c of G.co){const d=Math.hypot(p.x-c.x,p.y-c.y);if(d<pk||end)c.at=1;if(c.at&&d>0){c.x+=(p.x-c.x)/d*420*dt;c.y+=(p.y-c.y)/d*420*dt}if(d<14){const v=c.v;c.v=0;earnGold(v);gainXp(v)}}
G.co=G.co.filter(c=>c.v>0);
for(const fruit of G.fruits)if(Math.hypot(p.x-fruit.x,p.y-fruit.y)<18){fruit.picked=true;collectFruit()}G.fruits=G.fruits.filter(fruit=>!fruit.picked);
for(const crate of G.crates)if(Math.hypot(p.x-crate.x,p.y-crate.y)<18){crate.picked=true;collectCrate(crate)}G.crates=G.crates.filter(crate=>!crate.picked);
lvChk();
for(const q of G.pa){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;q.l-=dt}G.pa=G.pa.filter(q=>q.l>0);
G.fx.forEach(f=>f.t-=dt);G.fx=G.fx.filter(f=>f.t>0);
if(end){const hv=Math.max(0,Math.round(G.st.harv));earnGold(hv+G.wave);gainXp(hv);lvChk();achievementProgress.wavesCleared++;if(G.mode==='infinite')achievementProgress.infiniteBestWave=Math.max(achievementProgress.infiniteBestWave,G.wave);if(G.damageTakenWave===0)achievementProgress.noHitWaves++;checkAchievements();saveAchievementProgress();if(G.mode!=='infinite'&&G.wave>=20)over(true);else shop()}}

let luOpts=[];
function lvlUp(){if(G.pend<=0){shop();return}G.sc='lvl';const pool=[...LU].sort(()=>Math.random()-.5).slice(0,3),lvn=G.lv-G.pend+1;
luOpts=pool.map(u=>{const t=rollTier(lvn*.7),val=+(u.v*[1,2,3,4][t]).toFixed(3),shown=G.ch==='Explorador'&&u.k==='rdm'?val*1.5:val;return{k:u.k,t,s:{[u.k]:val},txt:'+'+(u.p?Math.round(shown*100)+'%':shown)+' '+u.n}});
ov.innerHTML=`<h2>⬆ Nivel ${lvn}</h2><p>Elige una mejora (${G.pend} pendiente/s)</p><div class="row">`+luOpts.map((u,i)=>`<div class="card" style="border-color:${TC[u.t]}"><span class="bdg" style="background:${TC[u.t]}">${TN[u.t]}</span><b>${u.txt}</b><button onclick="pickLU(${i})">Elegir</button></div>`).join('')+'</div>';ov.style.display='block'}
function pickLU(i){add(luOpts[i].s);G.pend--;lvlUp()}
function multiplayerClientFromHost(){if(window.parent===window)return null;try{if(window.parent.location.origin!==location.origin)return null;const account=window.parent.ARCADE_ACCOUNT;return account&&typeof account.getClient==='function'?account.getClient():null}catch(error){console.warn('No se pudo acceder a la cuenta del sitio anfitrión.',error);return null}}
function closeMultiplayerChannel(){if(!multiplayerClient||!multiplayerChannel)return;const channel=multiplayerChannel;multiplayerChannel=null;multiplayerChannelName='';multiplayerClient.removeChannel(channel).then(status=>{if(status!=='ok')console.warn('No se pudo cerrar el canal de la sala.',status)}).catch(error=>console.warn('No se pudo cerrar el canal de la sala.',error))}
function escapeMultiplayerText(value){return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function multiplayerErrorText(error){if(error&&(error.code==='PGRST202'||error.code==='PGRST205'||error.code==='42P01'))return'Falta instalar el esquema de salas en Supabase. Aplica supabase-schema.sql y vuelve a intentarlo.';return error&&error.message?error.message:'Se produjo un error al conectar con las salas.'}
function renderMultiplayerFailure(message){ov.innerHTML=`<section class="menu-screen"><h2>♟ Sala cooperativa</h2><p id="multiplayerStatus" role="status" style="color:#ff8585">${escapeMultiplayerText(message)}</p><button class="menu-back" onclick="selectMode()">Volver a modos</button></section>`;ov.style.display='block'}
function showMultiplayerError(error){console.error('Error en la sala cooperativa.',error);multiplayerNotice=multiplayerErrorText(error);multiplayerNoticeIsError=true;const status=document.getElementById('multiplayerStatus');if(status){status.textContent=multiplayerNotice;status.style.color='#ff8585'}else renderMultiplayerFailure(multiplayerNotice)}
function setMultiplayerNotice(message,isError){multiplayerNotice=message;multiplayerNoticeIsError=Boolean(isError);const status=document.getElementById('multiplayerStatus');if(status){status.textContent=message;status.style.color=isError?'#ff8585':'var(--mut)'}}

async function loadMultiplayerHome(){const [lobbyResult,inviteResult]=await Promise.all([multiplayerClient.rpc('get_my_game_lobby'),multiplayerClient.rpc('get_my_game_lobby_invites')]);if(lobbyResult.error)throw lobbyResult.error;if(inviteResult.error)throw inviteResult.error;if(lobbyResult.data){await loadMultiplayerRoom(lobbyResult.data);return}multiplayerLobbyId=null;renderMultiplayerHome(Array.isArray(inviteResult.data)?inviteResult.data:[]);subscribeToLobbyInbox()}

C.addEventListener('pointerdown',e=>ptr=sp(e));C.addEventListener('pointermove',e=>{if(ptr)ptr=sp(e)});addEventListener('pointerup',()=>ptr=null);
menu();requestAnimationFrame(loop);applyTheme();
